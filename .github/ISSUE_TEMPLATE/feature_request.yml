# SPDX-License-Identifier: Apache-2.0
name: Feature request
description: Suggest a check, an improvement or another firewall for Security Monitor.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the open issues first. This issue is public: leave out host names, credentials and
        other private data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What on your server does Security Monitor not see or misjudge, or what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Where would the information come from (a command, a file, an API), and what should the page say about it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other solutions or workarounds you have considered.
  - type: dropdown
    id: help
    attributes:
      label: Would you help?
      options:
        - "Yes, with a pull request"
        - "Yes, by testing it on my server"
        - "No"
    validations:
      required: false
