# Makes a release on request: Actions › release › Run workflow (on main).
# Checks the version, requires the test workflow and the shared suite (workflow e2e-suite) to have
# passed for this commit (waiting up to 20 minutes for each), runs the tests, builds the .deb and
# the source archive and creates the tag vVERSION with a GitHub release (package, archive,
# SHA256SUMS, signed build provenance, notes from CHANGELOG.md). Releases carry no .rpm yet: the
# page is tested only on Debian and Ubuntu so far.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0 (empty: the VERSION in plugin/security.js)"
        required: false
        default: ""
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write       # tag and release
  id-token: write       # signing the build provenance
  attestations: write   # storing the build provenance
  actions: read         # the results of the test workflow and the shared suite for this commit

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main only (this run: $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          code=$(sh tools/check-version.sh)
          version=${INPUT_VERSION:-$code}
          version=${version#v}
          if [ "$version" != "$code" ]; then
            echo "::error::Version $version differs from VERSION in plugin/security.js ($code). Change plugin/security.js first."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "::error::Tag v$version exists already."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every job of the test workflow on this very commit, not only the required check "test":
      # also Python 3.8 and the real Cockpit session with UFW and Docker. The run may still be
      # going, and for a while after it ends the list of runs can show it unfinished or not at all
      # (Update Gaps 0.3.0: 20 seconds after the run ended). So ask every 20 seconds, for at most
      # 20 minutes; a finished run without success stops the release at once.
      - name: The test workflow passed for this commit
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          limit=$(( $(date +%s) + 1200 ))
          while :; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json status,conclusion,url \
              --jq '.[] | "\(.status)/\(.conclusion) \(.url)"') || run=
            state=${run%% *}
            case $state in
              completed/success)
                echo "The test workflow passed for $GITHUB_SHA: ${run#* }"
                exit 0 ;;
              completed/*)
                echo "::error::The test workflow did not pass for $GITHUB_SHA (${state#completed/}): ${run#* }. Fix it first."
                exit 1 ;;
            esac
            state=${state%/}
            if [ "$(date +%s)" -ge "$limit" ]; then
              echo "::error::The test workflow has not passed for $GITHUB_SHA within 20 minutes (${state:-no run}). Wait for it, then start the release again."
              exit 1
            fi
            echo "Waiting for the test workflow (${state:-no run listed yet})."
            sleep 20
          done

      # The shared suite (workflow e2e-suite, E2E-1) on this very commit: its push run on main
      # built this commit as the candidate, with the counterparts of the released combination it
      # pins, and both its job E2E-1 and its gate passed. The version manifest in the run's
      # artifact must name exactly this commit for this repository, and no problem; a run that
      # skipped the suite or built another commit does not count. Asked as the test workflow is.
      - name: The shared suite passed for this commit
        timeout-minutes: 22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          limit=$(( $(date +%s) + 1200 ))
          while :; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow e2e-suite.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json databaseId,status,conclusion \
              --jq '.[] | "\(.status)/\(.conclusion) \(.databaseId)"') || run=
            state=${run%% *}
            case $state in
              completed/success) break ;;
              completed/*)
                echo "::error::The shared suite did not pass for $GITHUB_SHA (${state#completed/}, run ${run#* }). Fix it first."
                exit 1 ;;
            esac
            state=${state%/}
            if [ "$(date +%s)" -ge "$limit" ]; then
              echo "::error::The shared suite has not passed for $GITHUB_SHA within 20 minutes (${state:-no run}). Wait for it, then start the release again."
              exit 1
            fi
            echo "Waiting for the shared suite (${state:-no run listed yet})."
            sleep 20
          done
          id=${run#* }
          gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | "\(.conclusion) \(.name)"' > "$RUNNER_TEMP/suite-jobs.txt"
          cat "$RUNNER_TEMP/suite-jobs.txt"
          for job in "e2e-suite / E2E-1 (real components)" "e2e-suite / gate"; do
            if ! grep -qxF "success $job" "$RUNNER_TEMP/suite-jobs.txt"; then
              echo "::error::Run $id of the shared suite has no successful job \"$job\"."
              exit 1
            fi
          done
          gh run download "$id" --repo "$GITHUB_REPOSITORY" --name e2e-suite --dir "$RUNNER_TEMP/suite-proof"
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            '(.problems | length) == 0 and ([.components[] | select(.repository == $repo and .commit == $sha and .source == "candidate")] | length) == 1' \
            "$RUNNER_TEMP/suite-proof/manifest.json" > /dev/null; then
            echo "::error::The version manifest of run $id does not name $GITHUB_REPOSITORY at $GITHUB_SHA as its candidate, or has a problem."
            exit 1
          fi
          jq -r '.components[] | "\(.repository) \(.source) \(.commit) \(.version)"' "$RUNNER_TEMP/suite-proof/manifest.json"
          echo "The shared suite passed for $GITHUB_SHA: run $id."

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Tests
        run: make check

      - name: Package (.deb) and source archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh tools/apt-get.sh update
          sh tools/apt-get.sh install --no-install-recommends rpm
          make packages
          make dist
          rm -f dist/*.rpm
          { sha256sum "cockpit-security-monitor-$VERSION.tar.gz"; (cd dist && sha256sum *.deb); } > SHA256SUMS

      - name: Build provenance for the package and the archive
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cockpit-security-monitor-${{ steps.version.outputs.version }}.tar.gz
            dist/*.deb

      - name: Release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh tools/release-notes.sh "$VERSION" > notes.md
          deb=cockpit-security-monitor_$(printf '%s' "$VERSION" | tr '-' '~')-1_all.deb
          {
            echo
            echo "### Install"
            echo
            echo "From the Azentrius package repository (Debian, Ubuntu): set up https://packages.azentrius.com once, then install Security Monitor in Cockpit under Applications, or with \`sudo apt install cockpit-security-monitor\`. The repository takes this release within an hour."
            echo
            echo "From the files of this release: download the package and \`SHA256SUMS\`, check that the download is complete and that this repository's release workflow built it, then install it:"
            echo
            echo '```sh'
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo "gh attestation verify $deb --repo $GITHUB_REPOSITORY"
            echo "sudo apt install ./$deb"
            echo '```'
            echo
            echo "Security Monitor is tested on Debian and Ubuntu so far; there is no \`.rpm\` yet (firewalld, the packet filter of Fedora and RHEL, is not read on its own yet)."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -- --target "$GITHUB_SHA" --title "Security Monitor $VERSION" --notes-file notes.md
          if [ "$PRERELEASE" = "true" ]; then
            set -- "$@" --prerelease
          fi
          gh release create "v$VERSION" dist/*.deb "cockpit-security-monitor-$VERSION.tar.gz" SHA256SUMS "$@"
