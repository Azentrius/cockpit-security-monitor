# What tools/build-packages.sh needs to know about this package (sourced by sh).
# SPDX-License-Identifier: Apache-2.0

NAME=cockpit-security-monitor
SUMMARY="Cockpit page: what is reachable from where on a server, who logs in, what weakens its containers"
DESCRIPTION="Shows per port whether it is reachable from the internet, the VPN, the private network or only the host itself, for IPv4 and IPv6, with the rule that decides: it reads UFW, Docker (which forwards published ports past UFW), nftables and iptables, and optionally the Hetzner Cloud Firewall with a read-only token. It also shows the SSH configuration and keys, the logins of the last 14 days, settings of containers that weaken the boundary to the host, and CrowdSec and fail2ban if installed: for fail2ban what each jail watches, whom it bans and where a ban does not reach a port Docker forwards past it. A status for the Azentrius Status Board and Cockpit's menu. Read only; the one change it makes is marking a finding as expected in its own file."
HOMEPAGE=https://github.com/Azentrius/cockpit-security-monitor
MAINTAINER="Azentrius <support@azentrius.com>"
LICENSE="Apache-2.0 AND OFL-1.1 AND CC-BY-4.0"

# One dependency per line, in each format's syntax. iproute2 (ip, ss) is the source of the
# addresses and sockets; nftables, iptables, Docker, OpenSSH, CrowdSec and fail2ban are read when
# they are there, and the page says what is missing. The minimums (README, Requirements): Cockpit
# 264 (also in plugin/manifest.json), Python 3.8.
DEB_DEPENDS="cockpit-bridge (>= 264)
python3 (>= 3.8)
iproute2"
RPM_REQUIRES="cockpit-bridge >= 264
python3 >= 3.8
iproute"

# What the package owns below the staged root (directories are taken whole).
FILES="/usr/share/cockpit/security
/usr/lib/cockpit-security-monitor
/usr/lib/systemd/system/cockpit-security-scan.service
/usr/lib/systemd/system/cockpit-security-scan.timer
/usr/lib/systemd/system/cockpit-security-hetzner.service
%dir /etc/cockpit-security-monitor
/usr/share/metainfo/de.azentrius.security_monitor.metainfo.xml
/usr/share/doc/cockpit-security-monitor"
